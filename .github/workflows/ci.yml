name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify .NET version
      run: dotnet --version

    - name: Restore
      run: dotnet restore RaceDay.slnx

    - name: Build
      run: dotnet build RaceDay.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test RaceDay.slnx --configuration Release --no-build --verbosity normal

    - name: Success message
      run: echo "✅ Build and tests passed!"