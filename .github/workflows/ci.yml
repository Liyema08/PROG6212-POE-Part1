name: CI - Validate Part 1 Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check docs folder exists
      run: |
        if [ ! -d "docs" ]; then
          echo "❌ Error: docs folder not found"
          exit 1
        fi
        echo "✅ docs folder found"
    
    - name: Check ERD exists
      run: |
        if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ]; then
          echo "❌ Error: ERD not found in docs folder"
          exit 1
        fi
        echo "✅ ERD file found"
    
    - name: Check API Endpoint Plan exists
      run: |
        if [ ! -f "docs/API_Endpoint_Plan.md" ]; then
          echo "❌ Error: API Endpoint Plan not found"
          exit 1
        fi
        echo "✅ API Endpoint Plan found"
    
    - name: Check SQL script exists
      run: |
        if [ ! -f "docs/RaceDay_Database.sql" ]; then
          echo "❌ Error: SQL script not found"
          exit 1
        fi
        echo "✅ SQL script found"
    
    - name: Check README exists
      run: |
        if [ ! -f "README.md" ]; then
          echo "❌ Error: README.md not found"
          exit 1
        fi
        echo "✅ README.md found"
    
    - name: Display success message
      run: |
        echo "========================================="
        echo "🎉 All validation checks passed!"
        echo "========================================="
        echo "📁 docs folder: ✅ OK"
        echo "📊 ERD: ✅ OK"
        echo "📋 API Endpoint Plan: ✅ OK"
        echo "🗄️ SQL Script: ✅ OK"
        echo "📖 README: ✅ OK"
        echo "========================================="